          • <mark>Scala</mark> - Play framework based microservices - RESTful APIs - <mark>Couchbase</mark>
          • Transition/migration into AWS ECS from hosted data center - <mark>docker</mark>, <mark>ECS</mark>, <mark>CloudFormation</mark>
          • CI - Build, test automation, config management and deploy - <mark>jenkins</mark>, <mark>puppet</mark>, <mark>BDD</mark>

