          • Build, Test Automation & Deployment pipeline - <mark>AWS CodePipeline</mark>, <mark>CodeBuild</mark>
          • Stateful applications/services - <mark>AWS ECS</mark>, <mark>docker</mark>
          • Stateless services - <mark>AWS Lambda (Python)</mark>, <mark>SNS</mark>, <mark>API Gateway</mark>

      - layout: left
        title: Kantar / Lightspeed Research
        sub_title: Architect & Technical Lead
